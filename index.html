<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>大阪・神戶 5天4夜 隨行規劃助手</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Google Fonts: Noto Sans TC & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#F5F7FB',
              100: '#EAEFF8',
              500: '#3B82F6',
              600: '#2563EB',
              700: '#1D4ED8',
              accent: '#F97316'
            }
          }
        }
      }
    }
  </script>

  <style>
    /* iOS Momentum scrolling & smooth transitions */
    * {
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Timeline connecting line */
    .timeline-item::before {
      content: '';
      position: absolute;
      left: 19px;
      top: 36px;
      bottom: -16px;
      width: 2px;
      background-color: #E2E8F0;
    }
    .timeline-item:last-child::before {
      display: none;
    }
    /* Slide over / bottom sheet animation */
    .drawer-enter {
      transform: translateY(100%);
    }
    .drawer-active {
      transform: translateY(0%);
    }
    @media (min-width: 1024px) {
      .drawer-enter {
        transform: translateY(0%);
      }
    }
    /* Safe-area insets for modern mobile notched devices */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 0px);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col font-sans pb-28 lg:pb-12 selection:bg-blue-100 selection:text-blue-900">

  <!-- Top App Bar -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200/80 pt-safe">
    <div class="max-w-6xl mx-auto px-4 py-2.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-sm shadow-blue-200 flex-shrink-0">
          <i class="ph-bold ph-airplane-tilt text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-sm sm:text-base font-bold text-slate-900 leading-tight">大阪・關西 隨身行</h1>
            <span id="saveStatusBadge" class="text-[10px] font-medium px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-200 flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
              已自動儲存
            </span>
          </div>
          <p class="text-[11px] text-slate-500 truncate max-w-[210px] sm:max-w-none">
            🏨 宿：香榭麗大國 2（大國町站步行4分）
          </p>
        </div>
      </div>

      <!-- Action Utilities Header Buttons -->
      <div class="flex items-center gap-1.5">
        <button id="viewToggleShopsBtn" class="lg:hidden px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-orange-50 text-orange-600 border border-orange-200 flex items-center gap-1 active:scale-95 transition">
          <i class="ph-bold ph-storefront"></i>
          <span id="toggleShopsBtnText">周邊店家</span>
        </button>
        <button id="dataSettingsBtn" class="p-2 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 active:scale-95 transition" title="備份與資料管理">
          <i class="ph-bold ph-gear text-lg"></i>
        </button>
      </div>
    </div>

    <!-- Day Navigation Scroll Tab Bar -->
    <div class="bg-white border-t border-slate-100 px-3 py-1.5">
      <div class="max-w-6xl mx-auto flex items-center overflow-x-auto no-scrollbar gap-2" id="dayTabsList">
        <!-- Injected via JS -->
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-6xl mx-auto w-full px-3 sm:px-6 py-4">
    <!-- Day Title & Summary Card -->
    <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200/90 shadow-sm mb-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <div class="flex items-center gap-2">
            <span id="currentDayBadge" class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-blue-100 text-blue-700">Day 1</span>
            <span id="currentDayTheme" class="text-xs font-semibold text-slate-500">南大阪經典巡禮</span>
          </div>
          <h2 id="currentDayTitle" class="text-base sm:text-xl font-bold text-slate-900 mt-1">抵達大阪 ＆ 悠閒住吉大社巡禮</h2>
          <p id="currentDayDesc" class="text-xs sm:text-sm text-slate-600 mt-0.5 leading-relaxed">入住大國町民宿，漫步千年神社朱紅反橋，晚餐享用極上熟成和牛／燒肉。</p>
        </div>

        <div class="flex items-center gap-2 self-start sm:self-auto flex-shrink-0">
          <button id="editDayInfoBtn" class="px-3 py-1.5 text-xs font-medium rounded-lg text-slate-600 bg-slate-100 hover:bg-slate-200 flex items-center gap-1 active:scale-95 transition">
            <i class="ph-bold ph-pencil-simple"></i>
            <span>編輯主題</span>
          </button>
          <button id="addStopHeaderBtn" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-white bg-blue-600 hover:bg-blue-700 flex items-center gap-1 shadow-sm shadow-blue-200 active:scale-95 transition">
            <i class="ph-bold ph-plus-circle"></i>
            <span>新增節點</span>
          </button>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
      
      <!-- Left: Interactive Timeline Card List (7 Cols on desktop) -->
      <section class="lg:col-span-7 space-y-3" id="timelineSection">
        <div class="flex items-center justify-between px-1">
          <div class="flex items-center gap-1.5 text-xs font-bold text-slate-700">
            <i class="ph-bold ph-clock text-blue-600 text-sm"></i>
            <span>時間軸行程節點</span>
            <span id="stopsCountBadge" class="px-1.5 py-0.2 bg-slate-200 text-slate-700 rounded-full text-[10px]">0</span>
          </div>
          <span class="text-[11px] text-slate-400">點選節點可查看或綁定周邊名店</span>
        </div>

        <div id="timelineContainer" class="space-y-3 relative">
          <!-- Timeline stop cards injected by JS -->
        </div>
      </section>

      <!-- Right / Mobile Drawer: Nearby Street Shops (5 Cols on desktop, Drawer on Mobile) -->
      <section id="shopsDrawerContainer" class="fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-sm lg:static lg:bg-transparent lg:backdrop-blur-none lg:z-auto lg:col-span-5 hidden lg:block transition-opacity">
        <div class="fixed bottom-0 left-0 right-0 max-h-[85vh] h-full lg:max-h-none lg:h-auto lg:static bg-white rounded-t-3xl lg:rounded-2xl border-t lg:border border-slate-200 shadow-xl lg:shadow-sm flex flex-col overflow-hidden pb-safe">
          
          <!-- Mobile Drawer Grab handle & Header -->
          <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-white flex-shrink-0">
            <div class="flex items-center gap-2">
              <div class="w-7 h-7 rounded-lg bg-orange-100 text-orange-600 flex items-center justify-center">
                <i class="ph-bold ph-storefront"></i>
              </div>
              <div>
                <h3 class="text-xs sm:text-sm font-bold text-slate-900">周邊推薦街邊店</h3>
                <p id="shopTargetStopName" class="text-[11px] text-orange-600 font-medium truncate max-w-[190px]">全部當日景點</p>
              </div>
            </div>

            <div class="flex items-center gap-1.5">
              <button id="addShopQuickBtn" class="px-2.5 py-1 text-xs font-semibold bg-orange-600 text-white rounded-lg shadow-sm shadow-orange-200 hover:bg-orange-700 flex items-center gap-1 active:scale-95 transition">
                <i class="ph-bold ph-plus"></i>
                <span>新增私房店</span>
              </button>
              <button id="closeDrawerBtn" class="lg:hidden p-1.5 text-slate-400 hover:text-slate-600 rounded-lg">
                <i class="ph-bold ph-x text-lg"></i>
              </button>
            </div>
          </div>

          <!-- Category Filter Pills -->
          <div class="px-3 py-2 border-b border-slate-100 flex gap-1.5 overflow-x-auto no-scrollbar bg-slate-50/70 flex-shrink-0" id="shopCategoryFilterBar">
            <button data-cat="all" class="shop-filter-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-900 text-white flex-shrink-0">全部</button>
            <button data-cat="food" class="shop-filter-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 flex-shrink-0">必吃・小吃</button>
            <button data-cat="cafe" class="shop-filter-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 flex-shrink-0">咖啡・甜點</button>
            <button data-cat="night" class="shop-filter-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 flex-shrink-0">居酒屋・宵夜</button>
            <button data-cat="goods" class="shop-filter-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 flex-shrink-0">伴手禮・選物</button>
          </div>

          <!-- Shops List Scroll Area -->
          <div id="shopsListContainer" class="p-3 space-y-2.5 overflow-y-auto max-h-[520px] divide-y divide-slate-100 flex-1">
            <!-- Injected by JS -->
          </div>

          <!-- Drawer Footer Map Search Helper -->
          <div class="p-3 border-t border-slate-100 bg-slate-50 text-center flex-shrink-0">
            <a id="searchTargetGoogleMapBtn" href="https://maps.google.com" target="_blank" class="inline-flex items-center gap-1.5 text-xs text-blue-600 hover:text-blue-700 font-semibold py-0.5">
              <span>在 Google Maps 探索附近更多景點美食</span>
              <i class="ph-bold ph-arrow-square-out"></i>
            </a>
          </div>

        </div>
      </section>

    </div>
  </main>

  <aside class="fixed bottom-0 left-0 right-0 z-20 bg-white/95 backdrop-blur-md border-t border-slate-200 py-2 px-4 lg:hidden pb-safe shadow-lg">
    <div class="max-w-md mx-auto grid grid-cols-4 gap-2">
      <button id="mobileAddStopBtn" class="flex flex-col items-center justify-center p-1.5 text-blue-600 font-semibold text-[11px] rounded-xl hover:bg-blue-50 active:scale-95 transition">
        <i class="ph-bold ph-plus-circle text-xl"></i>
        <span>加景點</span>
      </button>
      <button id="mobileAddShopBtn" class="flex flex-col items-center justify-center p-1.5 text-orange-600 font-semibold text-[11px] rounded-xl hover:bg-orange-50 active:scale-95 transition">
        <i class="ph-bold ph-storefront text-xl"></i>
        <span>加名店</span>
      </button>
      <button id="mobileOpenShopsDrawerBtn" class="flex flex-col items-center justify-center p-1.5 text-slate-700 font-semibold text-[11px] rounded-xl hover:bg-slate-100 active:scale-95 transition relative">
        <i class="ph-bold ph-compass text-xl"></i>
        <span>看周邊</span>
      </button>
      <button id="mobileOpenSettingsBtn" class="flex flex-col items-center justify-center p-1.5 text-slate-700 font-semibold text-[11px] rounded-xl hover:bg-slate-100 active:scale-95 transition">
        <i class="ph-bold ph-floppy-disk text-xl"></i>
        <span>備份管理</span>
      </button>
    </div>
  </aside>

  <!-- MODAL 1: Edit / Create Timeline Stop Modal -->
  <div id="stopModal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
    <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[90vh] flex flex-col border border-slate-200 shadow-2xl overflow-hidden pb-safe">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between flex-shrink-0">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center">
            <i class="ph-bold ph-map-pin text-base"></i>
          </div>
          <h3 id="stopModalTitle" class="text-sm sm:text-base font-bold text-slate-900">編輯行程節點</h3>
        </div>
        <button id="closeStopModalBtn" class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg">
          <i class="ph-bold ph-x text-lg"></i>
        </button>
      </div>

      <form id="stopForm" class="p-5 space-y-3.5 overflow-y-auto flex-1 text-xs">
        <input type="hidden" id="formStopId">

        <div>
          <label class="block font-bold text-slate-700 mb-1">節點名稱 / 景點名稱 *</label>
          <input type="text" id="formStopName" required placeholder="例如：國寶姬路城 (白鷺城登大天守)" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-xs font-medium">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-700 mb-1">分類屬性</label>
            <select id="formStopCategory" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-xs font-medium">
              <option value="sight">🏛️ 觀光・古蹟名勝</option>
              <option value="food">🍱 必吃美食・燒肉</option>
              <option value="transit">🚆 交通移動・鐵路</option>
              <option value="lodging">🏨 住宿退房・放行李</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">停留時間 (分鐘)</label>
            <input type="number" id="formStopStayMins" min="0" step="5" value="60" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-xs font-medium">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-700 mb-1">出發時間 (HH:MM)</label>
            <input type="time" id="formStopDepTime" required class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-xs font-semibold">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">抵達時間 (HH:MM)</label>
            <input type="time" id="formStopArrTime" required class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-xs font-semibold">
          </div>
        </div>

        <div class="p-3 bg-slate-50 rounded-xl border border-slate-200/80 space-y-2">
          <label class="block font-bold text-slate-700">交通方式與車程描述</label>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="formStopTravelMode" placeholder="如：JR 新快速 (直達)" class="px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs bg-white">
            <input type="number" id="formStopTravelMins" placeholder="車程分鐘 (如 40)" min="0" class="px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs bg-white">
          </div>
          <input type="text" id="formStopTravelDetail" placeholder="路線細節：由大國町搭地鐵至梅田轉 JR 新快速直達" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs bg-white">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">重點備忘 / 行前攻略重點</label>
          <textarea id="formStopNote" rows="2" placeholder="備註預約提醒、登天守閣梯級陡峭建議穿球鞋等..." class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-xs leading-relaxed"></textarea>
        </div>

        <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
          <button type="button" id="deleteStopBtn" class="text-xs font-medium text-rose-600 hover:text-rose-700 hidden flex items-center gap-1 py-1">
            <i class="ph-bold ph-trash"></i>
            <span>刪除此節點</span>
          </button>
          <div class="flex items-center gap-2 ml-auto">
            <button type="button" id="cancelStopModalBtn" class="px-3 py-2 rounded-xl text-slate-600 bg-slate-100 hover:bg-slate-200 font-medium text-xs">取消</button>
            <button type="submit" class="px-4 py-2 rounded-xl text-white bg-blue-600 hover:bg-blue-700 font-bold text-xs shadow-sm shadow-blue-200">儲存節點</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL 2: Add / Edit Street Shop Modal -->
  <div id="shopModal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl max-h-[90vh] flex flex-col border border-slate-200 shadow-2xl overflow-hidden pb-safe">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-orange-100 text-orange-600 flex items-center justify-center">
            <i class="ph-bold ph-storefront text-base"></i>
          </div>
          <h3 id="shopModalTitle" class="text-sm sm:text-base font-bold text-slate-900">新增周邊街邊私房店</h3>
        </div>
        <button id="closeShopModalBtn" class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg">
          <i class="ph-bold ph-x text-lg"></i>
        </button>
      </div>

      <form id="shopForm" class="p-5 space-y-3.5 overflow-y-auto flex-1 text-xs">
        <input type="hidden" id="formShopId">

        <div>
          <label class="block font-bold text-slate-700 mb-1">關聯行程節點 *</label>
          <select id="formShopStopTarget" required class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 text-xs font-medium">
            <!-- Dynamically populated options -->
          </select>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">店名 / 特色小吃 *</label>
          <input type="text" id="formShopName" required placeholder="如：星巴克 神戶北野異人館店" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-medium">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-700 mb-1">分類標籤</label>
            <select id="formShopCat" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-medium">
              <option value="food">🍱 必吃・小吃美食</option>
              <option value="cafe">☕ 咖啡・特色甜點</option>
              <option value="night">🍶 居酒屋・宵夜</option>
              <option value="goods">🛍️ 伴手禮・選物</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">消費價位</label>
            <select id="formShopPrice" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-medium">
              <option value="$">$ (平價小吃 500-1000¥)</option>
              <option value="$$">$$ (中等消費 1000-3000¥)</option>
              <option value="$$$">$$$ (精緻高檔 5000¥+)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">必點招牌與特色描述</label>
          <textarea id="formShopDesc" rows="2" placeholder="百年洋樓改建、必嚐草莓法式水果塔、外帶酥脆炸楓葉等..." class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs"></textarea>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Google Maps 搜尋關鍵字或連結</label>
          <input type="text" id="formShopQuery" placeholder="如：Starbucks Coffee Kobe Kitano" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs">
        </div>

        <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
          <button type="button" id="deleteShopBtn" class="text-xs font-medium text-rose-600 hover:text-rose-700 hidden flex items-center gap-1 py-1">
            <i class="ph-bold ph-trash"></i>
            <span>刪除店家</span>
          </button>
          <div class="flex items-center gap-2 ml-auto">
            <button type="button" id="cancelShopModalBtn" class="px-3 py-2 rounded-xl text-slate-600 bg-slate-100 hover:bg-slate-200 font-medium text-xs">取消</button>
            <button type="submit" class="px-4 py-2 rounded-xl text-white bg-orange-600 hover:bg-orange-700 font-bold text-xs shadow-sm shadow-orange-200">儲存店家</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL 3: Edit Day Theme & Info Modal -->

    // --- STATE MANAGEMENT ---
    let appData = [];
    let currentDayIndex = 0;
    let selectedStopId = null;
    let currentShopCategory = 'all';

    function initData() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          appData = JSON.parse(stored);
        } else {
          appData = JSON.parse(JSON.stringify(DEFAULT_ITINERARY_DATA));
          saveData(false);
        }
      } catch (err) {
        console.error("Failed to parse stored itinerary, fallback to default", err);
        appData = JSON.parse(JSON.stringify(DEFAULT_ITINERARY_DATA));
      }
    }

    function saveData(notify = true) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        if (notify) showToast("已自動儲存至本機");
      } catch (e) {
        console.error("Storage full or error", e);
        showToast("儲存失敗，請檢查瀏覽器空間");
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toastNotification');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }

    function renderDayTabs() {
      const container = document.getElementById('dayTabsList');
      container.innerHTML = '';

      appData.forEach((day, index) => {
        const isActive = index === currentDayIndex;
        const btn = document.createElement('button');
        btn.className = `flex-shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
          isActive 
            ? 'bg-blue-600 text-white shadow-sm shadow-blue-200 ring-2 ring-blue-600/20' 
            : 'bg-slate-100 hover:bg-slate-200 text-slate-700'
        }`;
        btn.innerHTML = `
          <span>Day ${day.day}</span>
          <span class="text-[10px] opacity-80 font-normal hidden sm:inline">・${day.theme.split('・')[0]}</span>
        `;
        btn.addEventListener('click', () => {
          currentDayIndex = index;
          selectedStopId = null;
          renderAll();
        });
        container.appendChild(btn);
      });
    }

    function renderDayHeader() {
      const currentDay = appData[currentDayIndex];
      document.getElementById('currentDayBadge').textContent = `Day ${currentDay.day}`;
      document.getElementById('currentDayTheme').textContent = currentDay.theme;
      document.getElementById('currentDayTitle').textContent = currentDay.title;
      document.getElementById('currentDayDesc').textContent = currentDay.desc;
      document.getElementById('stopsCountBadge').textContent = currentDay.stops.length;
    }

    function renderTimeline() {
      const currentDay = appData[currentDayIndex];
      const container = document.getElementById('timelineContainer');
      container.innerHTML = '';

      if (currentDay.stops.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center text-slate-400 space-y-2 border border-dashed border-slate-300">
            <i class="ph-bold ph-calendar-plus text-3xl"></i>
            <p class="text-xs">今天還沒有任何行程節點，點擊上方「新增節點」開始規劃！</p>
          </div>
        `;
        return;
      }

      currentDay.stops.forEach((stop, idx) => {
        const isSelected = selectedStopId === stop.id;
        const isFirst = idx === 0;
        const isLast = idx === currentDay.stops.length - 1;

        let badgeStyle = "bg-blue-50 text-blue-700 border-blue-200";
        let iconTag = "ph-map-pin";
        if (stop.category === 'food') {
          badgeStyle = "bg-amber-50 text-amber-700 border-amber-200";
          iconTag = "ph-fork-knife";
        } else if (stop.category === 'transit') {
          badgeStyle = "bg-slate-100 text-slate-700 border-slate-200";
          iconTag = "ph-train";
        } else if (stop.category === 'lodging') {
          badgeStyle = "bg-purple-50 text-purple-700 border-purple-200";
          iconTag = "ph-house-line";
        }

        const item = document.createElement('div');
        item.className = `timeline-item relative pl-9 sm:pl-11 transition group`;
        item.innerHTML = `
          <!-- Dot on timeline -->
          <div class="absolute left-2.5 top-4 w-4 h-4 rounded-full ${isSelected ? 'bg-blue-600 ring-4 ring-blue-100 scale-110' : 'bg-slate-300'} flex items-center justify-center transition-all z-10">
            <div class="w-1.5 h-1.5 rounded-full bg-white"></div>
          </div>

          <!-- Main Card -->
          <div class="bg-white rounded-2xl p-3.5 sm:p-4 border transition-all ${
            isSelected 
              ? 'border-blue-500 shadow-md ring-1 ring-blue-500/20' 
              : 'border-slate-200/90 hover:border-slate-300 hover:shadow-sm'
          }">
            
            <!-- Card Top: Time, Category Badge, and Edit Utilities -->
            <div class="flex items-center justify-between gap-2 pb-2 border-b border-slate-100">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-xs font-bold text-slate-900 font-mono tracking-tight bg-slate-100 px-2 py-0.5 rounded-md">
                  ${stop.depTime} → ${stop.arrTime}
                </span>
                ${stop.stayMins > 0 ? `<span class="text-[10px] font-medium text-slate-400">停 ${stop.stayMins} 分</span>` : ''}
                <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded border ${badgeStyle} flex items-center gap-0.5">
                  <i class="ph-bold ${iconTag}"></i>
                  <span>${stop.category.toUpperCase()}</span>
                </span>
              </div>

              <!-- Reorder and Edit Actions -->
              <div class="flex items-center gap-1">
                <button data-action="move-up" class="p-1 text-slate-400 hover:text-slate-700 disabled:opacity-20" ${isFirst ? 'disabled' : ''} title="上移">
                  <i class="ph-bold ph-caret-up text-xs"></i>
                </button>
                <button data-action="move-down" class="p-1 text-slate-400 hover:text-slate-700 disabled:opacity-20" ${isLast ? 'disabled' : ''} title="下移">
                  <i class="ph-bold ph-caret-down text-xs"></i>
                </button>
                <button data-action="edit" class="p-1 text-blue-600 hover:bg-blue-50 rounded-md transition" title="編輯此節點">
                  <i class="ph-bold ph-pencil-simple text-xs"></i>
                </button>
              </div>
            </div>

            <!-- Card Body -->
            <div class="mt-2.5 space-y-2">
              <div class="flex items-start justify-between gap-2">
                <h4 class="text-xs sm:text-sm font-bold text-slate-900 leading-snug group-hover:text-blue-600 transition">
                  ${stop.name}
                </h4>
                <button data-action="select-shops" class="text-[11px] font-medium text-orange-600 hover:text-orange-700 flex-shrink-0 flex items-center gap-0.5 px-2 py-0.5 rounded-lg bg-orange-50 border border-orange-100">
                  <i class="ph-bold ph-storefront"></i>
                  <span>周邊 (${stop.shops ? stop.shops.length : 0})</span>
                </button>
              </div>

              <!-- Transit instruction if present -->
              ${stop.travelMode ? `
                <div class="bg-slate-50 rounded-xl p-2 text-[11px] text-slate-600 border border-slate-100 flex items-center gap-2">
                  <i class="ph-bold ph-path text-slate-400 text-xs flex-shrink-0"></i>
                  <span class="font-bold text-slate-800">${stop.travelMode}</span>
                  ${stop.travelMins ? `<span class="text-slate-400">| 約 ${stop.travelMins} 分</span>` : ''}
                  <span class="text-slate-500 truncate">${stop.travelDetail || ''}</span>
                </div>
              ` : ''}

              <!-- Note -->
              ${stop.note ? `
                <p class="text-[11px] text-slate-500 leading-relaxed bg-amber-50/40 p-2 rounded-xl border border-amber-100/50">
                  <span class="font-bold text-amber-900">💡 </span>${stop.note}
                </p>
              ` : ''}
            </div>

          </div>
        `;

        // Card Click Interactions
        item.querySelector('[data-action="select-shops"]').addEventListener('click', (e) => {
          e.stopPropagation();
          selectedStopId = stop.id;
          renderTimeline();
          renderShops();
          openShopsDrawer();
        });

        item.querySelector('[data-action="edit"]').addEventListener('click', (e) => {
          e.stopPropagation();
          openEditStopModal(stop);
        });

        const upBtn = item.querySelector('[data-action="move-up"]');
        if (upBtn) {
          upBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (idx > 0) {
              const temp = currentDay.stops[idx];
              currentDay.stops[idx] = currentDay.stops[idx - 1];
              currentDay.stops[idx - 1] = temp;
              saveData();
              renderTimeline();
            }
          });
        }

        const downBtn = item.querySelector('[data-action="move-down"]');
        if (downBtn) {
          downBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (idx < currentDay.stops.length - 1) {
              const temp = currentDay.stops[idx];
              currentDay.stops[idx] = currentDay.stops[idx + 1];
              currentDay.stops[idx + 1] = temp;
              saveData();
              renderTimeline();
            }
          });
        }

        // Tap on card body sets selection
        item.addEventListener('click', () => {
          selectedStopId = selectedStopId === stop.id ? null : stop.id;
          renderTimeline();
          renderShops();
        });

        container.appendChild(item);
      });
    }

    function renderShops() {
      const currentDay = appData[currentDayIndex];
      const container = document.getElementById('shopsListContainer');
      const targetBadge = document.getElementById('shopTargetStopName');
      container.innerHTML = '';

      let targetStops = currentDay.stops;
      if (selectedStopId) {
        const found = currentDay.stops.find(s => s.id === selectedStopId);
        if (found) {
          targetStops = [found];
          targetBadge.textContent = `📍 ${found.name.split(' (')[0].split(' ➔')[0]}`;
        }
      } else {
        targetBadge.textContent = `📍 全部當日景點 (${currentDay.stops.reduce((acc, s) => acc + (s.shops ? s.shops.length : 0), 0)} 家)`;
      }

      // Consolidate shops
      let allShops = [];
      targetStops.forEach(stop => {
        if (stop.shops && Array.isArray(stop.shops)) {
          stop.shops.forEach(sh => {
            allShops.push({ ...sh, parentStopId: stop.id, parentStopName: stop.name });
          });
        }
      });

      // Filter category
      if (currentShopCategory !== 'all') {
        allShops = allShops.filter(s => s.cat === currentShopCategory);
      }

      if (allShops.length === 0) {
        container.innerHTML = `
          <div class="py-12 text-center text-slate-400 space-y-2">
            <i class="ph-bold ph-storefront text-3xl"></i>
            <p class="text-xs">目前沒有符合條件的街邊店推薦</p>
            <button id="emptyAddShopBtn" class="px-3 py-1 text-xs font-semibold text-orange-600 bg-orange-50 rounded-lg hover:bg-orange-100">立即新增第一家</button>
          </div>
        `;
        const addBtn = document.getElementById('emptyAddShopBtn');
        if (addBtn) addBtn.addEventListener('click', () => openAddShopModal());
        return;
      }

      allShops.forEach(shop => {
        let catLabel = "小吃美食";
        let catColor = "bg-amber-50 text-amber-700 border-amber-200";
        if (shop.cat === 'cafe') {
          catLabel = "咖啡甜點";
          catColor = "bg-rose-50 text-rose-700 border-rose-200";
        } else if (shop.cat === 'goods') {
          catLabel = "伴手禮";
          catColor = "bg-emerald-50 text-emerald-700 border-emerald-200";
        } else if (shop.cat === 'night') {
          catLabel = "居酒屋宵夜";
          catColor = "bg-purple-50 text-purple-700 border-purple-200";
        }

        const row = document.createElement('div');
        row.className = "pt-2.5 pb-2.5 group hover:bg-slate-50/80 rounded-xl px-2 transition";
        row.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div class="space-y-0.5 flex-1 min-w-0">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-[9px] font-bold px-1.5 py-0.2 rounded border ${catColor}">${catLabel}</span>
                <span class="text-[10px] font-semibold text-slate-400">${shop.price || '$'}</span>
                <span class="text-[10px] text-slate-400 truncate max-w-[120px]">@ ${shop.parentStopName.split(' (')[0]}</span>
              </div>
              <h5 class="text-xs font-bold text-slate-900 group-hover:text-orange-600 transition truncate">${shop.name}</h5>
              <p class="text-[11px] text-slate-500 leading-relaxed">${shop.desc || '無特別備註'}</p>
            </div>

            <div class="flex items-center gap-1 flex-shrink-0 pt-1">
              <button data-action="edit-shop" class="p-1 text-slate-400 hover:text-slate-700 rounded-md hover:bg-slate-100 transition" title="編輯此店">
                <i class="ph-bold ph-pencil-simple text-xs"></i>
              </button>
              <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(shop.query || shop.name)}" target="_blank" class="p-1 text-blue-600 hover:text-blue-800 rounded-md hover:bg-blue-50 transition" title="在 Google Maps 開啟">
                <i class="ph-bold ph-arrow-square-out text-xs"></i>
              </a>
            </div>
          </div>
        `;

        row.querySelector('[data-action="edit-shop"]').addEventListener('click', () => {
          openEditShopModal(shop);
        });

        container.appendChild(row);
      });

      // Update bottom maps link query
      const mapBtn = document.getElementById('searchTargetGoogleMapBtn');
      const searchTarget = selectedStopId && targetStops[0] 
        ? targetStops[0].name.split(' (')[0]
        : `${currentDay.title.split(' ')[0]} 美食`;
      mapBtn.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(searchTarget)}`;
    }

    function openAddStopModal() {
      const currentDay = appData[currentDayIndex];
      document.getElementById('stopModalTitle').textContent = `Day ${currentDay.day} - 新增行程節點`;
      document.getElementById('formStopId').value = '';
      document.getElementById('formStopName').value = '';
      document.getElementById('formStopCategory').value = 'sight';
      document.getElementById('formStopStayMins').value = 60;
      
      // Auto time sequence
      let lastArr = "09:00";
      if (currentDay.stops.length > 0) {
        lastArr = currentDay.stops[currentDay.stops.length - 1].arrTime;
      }
      document.getElementById('formStopDepTime').value = lastArr;
      document.getElementById('formStopArrTime').value = lastArr;
      document.getElementById('formStopTravelMode').value = '';
      document.getElementById('formStopTravelMins').value = '';
      document.getElementById('formStopTravelDetail').value = '';
      document.getElementById('formStopNote').value = '';
      document.getElementById('deleteStopBtn').classList.add('hidden');

      document.getElementById('stopModal').classList.remove('hidden');
    }

    function openEditStopModal(stop) {
      document.getElementById('stopModalTitle').textContent = `編輯節點：${stop.name.split(' (')[0]}`;
      document.getElementById('formStopId').value = stop.id;
      document.getElementById('formStopName').value = stop.name;
      document.getElementById('formStopCategory').value = stop.category || 'sight';
      document.getElementById('formStopStayMins').value = stop.stayMins || 0;
      document.getElementById('formStopDepTime').value = stop.depTime || "09:00";
      document.getElementById('formStopArrTime').value = stop.arrTime || "10:00";
      document.getElementById('formStopTravelMode').value = stop.travelMode || '';
      document.getElementById('formStopTravelMins').value = stop.travelMins || '';
      document.getElementById('formStopTravelDetail').value = stop.travelDetail || '';
      document.getElementById('formStopNote').value = stop.note || '';
      document.getElementById('deleteStopBtn').classList.remove('hidden');

      document.getElementById('stopModal').classList.remove('hidden');
    }

    function handleStopFormSubmit(e) {
      e.preventDefault();
      const currentDay = appData[currentDayIndex];
      const stopId = document.getElementById('formStopId').value;

      const stopData = {
        name: document.getElementById('formStopName').value.trim(),
        category: document.getElementById('formStopCategory').value,
        stayMins: parseInt(document.getElementById('formStopStayMins').value) || 0,
        depTime: document.getElementById('formStopDepTime').value,
        arrTime: document.getElementById('formStopArrTime').value,
        travelMode: document.getElementById('formStopTravelMode').value.trim(),
        travelMins: parseInt(document.getElementById('formStopTravelMins').value) || 0,
        travelDetail: document.getElementById('formStopTravelDetail').value.trim(),
        note: document.getElementById('formStopNote').value.trim(),
      };

      if (stopId) {
        // Edit existing
        const index = currentDay.stops.findIndex(s => s.id === stopId);
        if (index !== -1) {
          currentDay.stops[index] = { ...currentDay.stops[index], ...stopData };
        }
      } else {
        // Create new
        const newStop = {
          ...stopData,
          id: `stop-${Date.now()}`,
          shops: []
        };
        currentDay.stops.push(newStop);
      }

      saveData();
      document.getElementById('stopModal').classList.add('hidden');
      renderTimeline();
      renderShops();
    }

    function handleDeleteStop() {
      const stopId = document.getElementById('formStopId').value;
      if (!stopId) return;
      const currentDay = appData[currentDayIndex];
      currentDay.stops = currentDay.stops.filter(s => s.id !== stopId);
      if (selectedStopId === stopId) selectedStopId = null;
      saveData();
      document.getElementById('stopModal').classList.add('hidden');
      renderTimeline();
      renderShops();
      showToast("節點已刪除");
    }

    function populateShopTargetSelect(selectedTargetId = null) {
      const select = document.getElementById('formShopStopTarget');
      select.innerHTML = '';
      const currentDay = appData[currentDayIndex];

      currentDay.stops.forEach(stop => {
        const opt = document.createElement('option');
        opt.value = stop.id;
        opt.textContent = stop.name;
        if (selectedTargetId && selectedTargetId === stop.id) {
          opt.selected = true;
        } else if (!selectedTargetId && selectedStopId === stop.id) {
          opt.selected = true;
        }
        select.appendChild(opt);
      });
    }

    function openAddShopModal() {
      const currentDay = appData[currentDayIndex];
      if (currentDay.stops.length === 0) {
        showToast("請先新增至少一個行程節點！");
        return;
      }
      populateShopTargetSelect();
      document.getElementById('shopModalTitle').textContent = "新增周邊街邊私房店";
      document.getElementById('formShopId').value = '';
      document.getElementById('formShopName').value = '';
      document.getElementById('formShopCat').value = 'food';
      document.getElementById('formShopPrice').value = '$';
      document.getElementById('formShopDesc').value = '';
      document.getElementById('formShopQuery').value = '';
      document.getElementById('deleteShopBtn').classList.add('hidden');
      document.getElementById('shopModal').classList.remove('hidden');
    }

    function openEditShopModal(shop) {
      populateShopTargetSelect(shop.parentStopId);
      document.getElementById('shopModalTitle').textContent = `編輯店家：${shop.name}`;
      document.getElementById('formShopId').value = shop.id;
      document.getElementById('formShopName').value = shop.name;
      document.getElementById('formShopCat').value = shop.cat || 'food';
      document.getElementById('formShopPrice').value = shop.price || '$';
      document.getElementById('formShopDesc').value = shop.desc || '';
      document.getElementById('formShopQuery').value = shop.query || shop.name;
      document.getElementById('deleteShopBtn').classList.remove('hidden');
      document.getElementById('shopModal').classList.remove('hidden');
    }

    function handleShopFormSubmit(e) {
      e.preventDefault();
      const shopId = document.getElementById('formShopId').value;
      const targetStopId = document.getElementById('formShopStopTarget').value;
      const currentDay = appData[currentDayIndex];

      const shopData = {
        name: document.getElementById('formShopName').value.trim(),
        cat: document.getElementById('formShopCat').value,
        price: document.getElementById('formShopPrice').value,
        desc: document.getElementById('formShopDesc').value.trim(),
        query: document.getElementById('formShopQuery').value.trim() || document.getElementById('formShopName').value.trim()
      };

      if (shopId) {
        // Remove from original
        currentDay.stops.forEach(s => {
          if (s.shops) s.shops = s.shops.filter(item => item.id !== shopId);
        });
        // Put in new or target
        const destStop = currentDay.stops.find(s => s.id === targetStopId);
        if (destStop) {
          if (!destStop.shops) destStop.shops = [];
          destStop.shops.push({ ...shopData, id: shopId });
        }
      } else {
        const destStop = currentDay.stops.find(s => s.id === targetStopId);
        if (destStop) {
          if (!destStop.shops) destStop.shops = [];
          destStop.shops.push({ ...shopData, id: `sh-${Date.now()}` });
        }
      }

      saveData();
      document.getElementById('shopModal').classList.add('hidden');
      renderTimeline();
      renderShops();
      showToast("店家資料已更新");
    }

    function handleDeleteShop() {
      const shopId = document.getElementById('formShopId').value;
      if (!shopId) return;
      const currentDay = appData[currentDayIndex];
      currentDay.stops.forEach(s => {
        if (s.shops) s.shops = s.shops.filter(sh => sh.id !== shopId);
      });
      saveData();
      document.getElementById('shopModal').classList.add('hidden');
      renderTimeline();
      renderShops();
      showToast("店家已刪除");
    }

    function openDayInfoModal() {
      const currentDay = appData[currentDayIndex];
      document.getElementById('formDayTheme').value = currentDay.theme;
      document.getElementById('formDayTitle').value = currentDay.title;
      document.getElementById('formDayDesc').value = currentDay.desc;
      document.getElementById('dayInfoModal').classList.remove('hidden');
    }

    function handleSaveDayInfo() {
      const currentDay = appData[currentDayIndex];
      currentDay.theme = document.getElementById('formDayTheme').value.trim();
      currentDay.title = document.getElementById('formDayTitle').value.trim();
      currentDay.desc = document.getElementById('formDayDesc').value.trim();
      saveData();
      document.getElementById('dayInfoModal').classList.add('hidden');
      renderDayTabs();
      renderDayHeader();
      showToast("主題標題已更新");
    }

    // Mobile Drawer Drawer Controls
    function openShopsDrawer() {
      const drawer = document.getElementById('shopsDrawerContainer');
      drawer.classList.remove('hidden');
    }

    function closeShopsDrawer() {
      const drawer = document.getElementById('shopsDrawerContainer');
      drawer.classList.add('hidden');
    }

    // JSON Export / Import / Reset to Default
    function exportJsonFile() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `Osaka_5D4N_Itinerary_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast("已匯出 JSON 備份檔");
    }

    function importJsonFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          if (Array.isArray(parsed) && parsed.length > 0) {
            appData = parsed;
            saveData();
            renderAll();
            document.getElementById('dataModal').classList.add('hidden');
            showToast("成功還原行程檔案！");
          } else {
            showToast("無效的 JSON 格式");
          }
        } catch (err) {
          showToast("解析失敗，非合法檔案");
        }
      };
      reader.readAsText(file);
    }

    function resetToDefault() {
      appData = JSON.parse(JSON.stringify(DEFAULT_ITINERARY_DATA));
      selectedStopId = null;
      saveData();
      document.getElementById('dataModal').classList.add('hidden');
      renderAll();
      showToast("已恢復原始預設行程！");
    }

    function setupEventListeners() {
      // Modals Open
      document.getElementById('addStopHeaderBtn').addEventListener('click', openAddStopModal);
      document.getElementById('mobileAddStopBtn').addEventListener('click', openAddStopModal);
      document.getElementById('addShopQuickBtn').addEventListener('click', openAddShopModal);
      document.getElementById('mobileAddShopBtn').addEventListener('click', openAddShopModal);
      document.getElementById('editDayInfoBtn').addEventListener('click', openDayInfoModal);
      
      document.getElementById('dataSettingsBtn').addEventListener('click', () => document.getElementById('dataModal').classList.remove('hidden'));
      document.getElementById('mobileOpenSettingsBtn').addEventListener('click', () => document.getElementById('dataModal').classList.remove('hidden'));

      // Modals Close
      document.getElementById('closeStopModalBtn').addEventListener('click', () => document.getElementById('stopModal').classList.add('hidden'));
      document.getElementById('cancelStopModalBtn').addEventListener('click', () => document.getElementById('stopModal').classList.add('hidden'));
      document.getElementById('closeShopModalBtn').addEventListener('click', () => document.getElementById('shopModal').classList.add('hidden'));
      document.getElementById('cancelShopModalBtn').addEventListener('click', () => document.getElementById('shopModal').classList.add('hidden'));
      document.getElementById('closeDayInfoModalBtn').addEventListener('click', () => document.getElementById('dayInfoModal').classList.add('hidden'));
      document.getElementById('cancelDayInfoBtn').addEventListener('click', () => document.getElementById('dayInfoModal').classList.add('hidden'));
      document.getElementById('closeDataModalBtn').addEventListener('click', () => document.getElementById('dataModal').classList.add('hidden'));
      document.getElementById('finishDataModalBtn').addEventListener('click', () => document.getElementById('dataModal').classList.add('hidden'));

      // Drawer Toggles
      document.getElementById('viewToggleShopsBtn').addEventListener('click', openShopsDrawer);
      document.getElementById('mobileOpenShopsDrawerBtn').addEventListener('click', openShopsDrawer);
      document.getElementById('closeDrawerBtn').addEventListener('click', closeShopsDrawer);

      // Forms Submit
      document.getElementById('stopForm').addEventListener('submit', handleStopFormSubmit);
      document.getElementById('deleteStopBtn').addEventListener('click', handleDeleteStop);
      document.getElementById('shopForm').addEventListener('submit', handleShopFormSubmit);
      document.getElementById('deleteShopBtn').addEventListener('click', handleDeleteShop);
      document.getElementById('saveDayInfoBtn').addEventListener('click', handleSaveDayInfo);

      // Data I/O
      document.getElementById('exportJsonBtn').addEventListener('click', exportJsonFile);
      document.getElementById('importJsonInput').addEventListener('change', importJsonFile);
      document.getElementById('resetDefaultBtn').addEventListener('click', resetToDefault);

      // Shop Category Filter Buttons
      const filterBtns = document.querySelectorAll('.shop-filter-btn');
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => {
            b.classList.remove('bg-slate-900', 'text-white');
            b.classList.add('bg-white', 'text-slate-600');
          });
          btn.classList.add('bg-slate-900', 'text-white');
          btn.classList.remove('bg-white', 'text-slate-600');
          currentShopCategory = btn.getAttribute('data-cat');
          renderShops();
        });
      });
    }

    function renderAll() {
      renderDayTabs();
      renderDayHeader();
      renderTimeline();
      renderShops();
    }

    // Startup
    window.addEventListener('DOMContentLoaded', () => {
      initData();
      renderAll();
      setupEventListeners();
    });
  </script>
</body>
</html>
